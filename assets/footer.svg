<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c12" />
      <stop offset="50%" stop-color="#0b1520" />
      <stop offset="100%" stop-color="#071412" />
    </linearGradient>
    <linearGradient id="fline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0" />
      <stop offset="25%" stop-color="#2dd4bf" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <style>
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.02em; }
      .role { font-family: 'Courier New', Courier, monospace; font-size: 12px; font-weight: 600; fill: #2dd4bf; letter-spacing: 0.14em; text-transform: uppercase; }
      .meta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #94a3b8; }
      .link { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #5eead4; }
    </style>
  </defs>

  <rect width="900" height="120" rx="12" fill="url(#fbg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <rect x="40" y="0" width="820" height="3" fill="url(#fline)" />

  <text x="450" y="42" text-anchor="middle" class="name">Imran Ahmed</text>
  <text x="450" y="66" text-anchor="middle" class="role">Senior Developer @ Rankinsoft</text>
  <text x="450" y="92" text-anchor="middle" class="meta">
    9+ Years · Laravel &amp; Full-Stack · Garment &amp; Textile Automation BD ·
    <tspan class="link">imrandev.bd</tspan>
  </text>
</svg>
