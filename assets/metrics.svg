<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110" fill="none">
  <defs>
    <linearGradient id="m-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080e14" />
      <stop offset="50%" stop-color="#0c1622" />
      <stop offset="100%" stop-color="#081419" />
    </linearGradient>
    <style>
      .num-stat { font-family: Georgia, serif; font-size: 32px; font-weight: 700; fill: #2dd4bf; }
      .lbl-stat { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #f8fafc; text-transform: uppercase; letter-spacing: 0.08em; }
      .sub-stat { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <rect width="900" height="110" rx="8" fill="url(#m-bg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Dividers -->
  <line x1="180" y1="18" x2="180" y2="92" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
  <line x1="360" y1="18" x2="360" y2="92" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
  <line x1="540" y1="18" x2="540" y2="92" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />
  <line x1="720" y1="18" x2="720" y2="92" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1" />

  <!-- Col 1 -->
  <g transform="translate(90, 24)" text-anchor="middle">
    <text y="28" class="num-stat">9+ Yrs</text>
    <text y="50" class="lbl-stat">Experience</text>
    <text y="68" class="sub-stat">Senior Architecture</text>
  </g>

  <!-- Col 2 -->
  <g transform="translate(270, 24)" text-anchor="middle">
    <text y="28" class="num-stat">200+</text>
    <text y="50" class="lbl-stat">Shipped</text>
    <text y="68" class="sub-stat">SaaS, ERP &amp; Apps</text>
  </g>

  <!-- Col 3 -->
  <g transform="translate(450, 24)" text-anchor="middle">
    <text y="28" class="num-stat">5k+</text>
    <text y="50" class="lbl-stat">Daily AI Ops</text>
    <text y="68" class="sub-stat">Zero manual touch</text>
  </g>

  <!-- Col 4 -->
  <g transform="translate(630, 24)" text-anchor="middle">
    <text y="28" class="num-stat">99.9%</text>
    <text y="50" class="lbl-stat">Uptime SLA</text>
    <text y="68" class="sub-stat">Horizon &amp; Docker</text>
  </g>

  <!-- Col 5 -->
  <g transform="translate(810, 24)" text-anchor="middle">
    <text y="28" class="num-stat">~40%</text>
    <text y="50" class="lbl-stat">Query Cut</text>
    <text y="68" class="sub-stat">MySQL &amp; Redis Tuning</text>
  </g>
</svg>
