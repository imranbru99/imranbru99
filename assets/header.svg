<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="50%" stop-color="#09131a" />
      <stop offset="100%" stop-color="#061f22" />
    </linearGradient>
    
    <radialGradient id="glow-teal" cx="80%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-copper" cx="15%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="text-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>

    <linearGradient id="border-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#084c47" />
      <stop offset="35%" stop-color="#0d9488" />
      <stop offset="70%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      .title-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#text-gold); letter-spacing: -0.02em; }
      .title-role { font-family: 'Courier New', Courier, monospace, 'IBM Plex Mono'; font-weight: 600; font-size: 13px; fill: #2dd4bf; letter-spacing: 0.16em; text-transform: uppercase; }
      .sub-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #94a3b8; }
      .pill-text { font-family: 'Courier New', Courier, monospace, 'IBM Plex Mono'; font-size: 11px; font-weight: 600; fill: #5eead4; letter-spacing: 0.04em; }
      .tag-copper { font-family: 'Courier New', Courier, monospace; font-size: 10px; font-weight: 700; fill: #fbbf24; letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- Base Sheet -->
  <rect width="900" height="220" rx="10" fill="url(#bg-grad)" />
  <rect width="900" height="220" rx="10" fill="url(#glow-teal)" />
  <rect width="900" height="220" rx="10" fill="url(#glow-copper)" />

  <!-- Outer Stroke -->
  <rect x="1" y="1" width="898" height="218" rx="9" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Geometric Grid Accent Lines -->
  <g opacity="0.15" stroke="#2dd4bf" stroke-width="0.75">
    <line x1="0" y1="44" x2="900" y2="44" />
    <line x1="0" y1="176" x2="900" y2="176" />
    <line x1="720" y1="0" x2="720" y2="220" />
    <line x1="180" y1="0" x2="180" y2="220" />
  </g>

  <!-- Bottom Accent Wave Bar -->
  <rect x="0" y="215" width="900" height="5" fill="url(#border-teal)" rx="2" />

  <!-- Seal Emblem Circle -->
  <g transform="translate(50, 42)">
    <circle cx="48" cy="48" r="46" fill="#042022" stroke="#2dd4bf" stroke-width="1.5" />
    <circle cx="48" cy="48" r="40" fill="none" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1" stroke-dasharray="4 3" />
    <text x="48" y="58" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="34" fill="#5eead4">iA</text>
  </g>

  <!-- Header Text -->
  <g transform="translate(170, 48)">
    <!-- Top Status Indicator -->
    <g transform="translate(0, 4)">
      <circle cx="4" cy="4" r="4" fill="#2dd4bf">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="8" class="title-role">Software Engineer - AI &amp; Platform @ Rankinsoft · Ex-Principal Blog Cutter AI</text>
    </g>

    <!-- Main Title Name -->
    <text x="0" y="48" class="title-name">Imran Ahmed</text>

    <!-- Subtitle Role -->
    <text x="0" y="74" class="sub-desc">Senior Laravel &amp; Full-Stack Architect · Production AI &amp; Distributed Queues</text>

    <!-- Badges Row -->
    <g transform="translate(0, 92)">
      <!-- Badge 1: Experience -->
      <g>
        <rect x="0" y="0" width="112" height="24" rx="12" fill="rgba(13, 148, 136, 0.18)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" />
        <text x="56" y="16" text-anchor="middle" class="pill-text">9+ YEARS EXP</text>
      </g>
      <!-- Badge 2: Scale -->
      <g transform="translate(120, 0)">
        <rect x="0" y="0" width="128" height="24" rx="12" fill="rgba(13, 148, 136, 0.18)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" />
        <text x="64" y="16" text-anchor="middle" class="pill-text">200+ PROJECTS</text>
      </g>
      <!-- Badge 3: Daily Ops -->
      <g transform="translate(256, 0)">
        <rect x="0" y="0" width="144" height="24" rx="12" fill="rgba(13, 148, 136, 0.18)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1" />
        <text x="72" y="16" text-anchor="middle" class="pill-text">5,000+ AI OPS/DAY</text>
      </g>
      <!-- Badge 4: SLA -->
      <g transform="translate(408, 0)">
        <rect x="0" y="0" width="128" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.45)" stroke-width="1" />
        <text x="64" y="16" text-anchor="middle" class="tag-copper">99.9% UPTIME SLA</text>
      </g>
      <!-- Badge 5: Packagist -->
      <g transform="translate(544, 0)">
        <rect x="0" y="0" width="142" height="24" rx="12" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1" />
        <text x="71" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#a5b4fc" letter-spacing="0.06em">PACKAGIST AUTHOR</text>
      </g>
    </g>
  </g>
</svg>
